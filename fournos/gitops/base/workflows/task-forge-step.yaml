apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: forge-step
spec:
  workspaces:
    - name: artifacts
      description: Shared artifact storage across pipeline tasks.
  params:
    - name: fjob-name
      type: string
    - name: fournos-workload-namespace
      type: string
    - name: kubeconfig-secret
      type: string
    - name: job-step
      type: string
    - name: job-step-name
      type: string
    - name: always-send-notification
      type: string
      default: "false"
    - name: forge-wait-for-step
      type: string
      default: "false"

  steps:
    - name: forge
      image: image-registry.openshift-image-registry.svc:5000/$(context.taskRun.namespace)/forge-core:latest
      imagePullPolicy: Always
      env:
      - name: TARGET_KUBECONFIG
        value: /var/run/secrets/fournos-kubeconfig/kubeconfig
      - name: FJOB_NAME
        value: "$(params.fjob-name)"
      - name: FOURNOS_WORKLOAD_NAMESPACE
        value: "$(params.fournos-workload-namespace)"
      - name: FOURNOS_STEP
        value: "$(params.job-step)"
      - name: FOURNOS_STEP_NAME
        value: "$(params.job-step-name)"
      - name: FOURNOS_SECRETS
        value: /var/run/secrets/fournos
      - name: FOURNOS_CI
        value: "true"
      - name: PSAP_FORGE_ALWAYS_SEND_NOTIFICATION
        value: "$(params.always-send-notification)"
      - name: PSAP_FORGE_WAIT_FOR_STEP
        value: "$(params.forge-wait-for-step)"

      volumeMounts:
        - name: kubeconfig
          mountPath: /var/run/secrets/fournos-kubeconfig
          readOnly: true
        - name: vault-secrets
          mountPath: /var/run/secrets/fournos
          readOnly: true
      script: |
        #!/usr/bin/env bash

        set -o pipefail
        set -o errexit
        set -o nounset
        set -o errtrace

        export ARTIFACT_BASE_DIR="$(workspaces.artifacts.path)"
        export ARTIFACT_DIR="${ARTIFACT_BASE_DIR}/${FOURNOS_STEP_NAME}"
        mkdir -p "${ARTIFACT_DIR}"

        exec &> >(tee -a "$ARTIFACT_DIR/run.log")

        # Fetch FournosJob from the hub cluster (in-cluster SA) before
        # switching KUBECONFIG to the target cluster.
        oc get "fjob/$FJOB_NAME" -n "$FOURNOS_WORKLOAD_NAMESPACE" -oyaml > $ARTIFACT_DIR/fournos_fjob.yaml

        export KUBECONFIG=$TARGET_KUBECONFIG

        # Function to conditionally export environment variables from FournosJob spec
        export_env_var_from_fjob() {
          local var_name="$1"
          local value=$(cat "$ARTIFACT_DIR/fournos_fjob.yaml" | yq -r ".spec.env.${var_name}")
          if [[ "$value" != null ]]; then
            export "$var_name=$value"
            echo "Exported $var_name=$value"
          else
            unset "$var_name" 2>/dev/null || true
            echo "Unset $var_name (was null in FournosJob spec)"
          fi
        }

        # Export environment variables from FournosJob spec
        export_env_var_from_fjob PULL_BASE_SHA
        export_env_var_from_fjob PULL_PULL_SHA
        export_env_var_from_fjob PULL_NUMBER

        if [[ "${PULL_PULL_SHA:-}" ]]; then
          echo
          echo "Updating to PULL_PULL_SHA=$PULL_PULL_SHA ..."

          git -C "$FORGE_HOME" fetch --quiet origin "$PULL_PULL_SHA"
          git -C "$FORGE_HOME" reset --hard FETCH_HEAD

        elif [[ "${PULL_NUMBER:-}" ]]; then
          echo
          echo "Updating to the HEAD commit of PR $PULL_NUMBER ..."
          commit="refs/pull/$PULL_NUMBER/head"

          git -C "$FORGE_HOME" fetch --quiet origin "$commit"
          git -C "$FORGE_HOME" reset --hard FETCH_HEAD
          export PULL_PULL_SHA="$(git rev-parse HEAD)"
          echo "Setting PULL_PULL_SHA to '$PULL_PULL_SHA'"
        else
          echo "No PULL_PULL_SHA nor PULL_NUMBER, using the image commit"
        fi
        git show --quiet

        FORGE_PROJECT=$(cat "$ARTIFACT_DIR/fournos_fjob.yaml" | yq -r .spec.executionEngine.forge.project)
        if [[ -z "$FORGE_PROJECT" || "$FORGE_PROJECT" == null ]]; then
          echo "ERROR: invalid .spec.executionEngine.forge.project='$FORGE_PROJECT' in $FOURNOS_WORKLOAD_NAMESPACE/$FJOB_NAME"
          exit 1
        fi

        exec bin/run_ci "$FORGE_PROJECT" ci "$FOURNOS_STEP"

  volumes:
    - name: kubeconfig
      secret:
        secretName: $(params.kubeconfig-secret)
