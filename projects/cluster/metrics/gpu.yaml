  unit: bytes/s
  metric: >-
    DCGM_FI_PROF_PCIE_RX_BYTES{exported_namespace="{namespace}", exported_pod=~"{pod_name}"}

gpu_pcie_tx_bytes:
  description: GPU PCIe transmit throughput
  unit: bytes/s
  metric: >-
    DCGM_FI_PROF_PCIE_TX_BYTES{exported_namespace="{namespace}", exported_pod=~"{pod_name}"}
