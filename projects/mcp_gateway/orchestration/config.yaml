vaults:
  all: []
  all-optional:
  - psap-forge-notifications
  - psap-forge-mlflow-export
  - psap-forge-aws-s3-export
  prepare: []
  test: []

notifications:
  slack:
    channel_id: C0BEBS6929L
    provider_module: projects.mcp_gateway.orchestration.notifications.MCPGatewaySlackProvider

metrics:
  enabled: true
  namespaces:
    - mcp-gw-bench
    - mcp-system
    - gateway-system
    - istio-system
  step_seconds: 15
  query_keys: []  # empty = all queries from queries.yaml

caliper:
  postprocess:
    enabled: true
    artifacts_dir: null
    plugin_module: projects.mcp_gateway.postprocess.mcp_gateway.plugin
    postprocess_config: null
    parse:
      enabled: true
      no_cache: false
    visualize:
      enabled: false
    kpi:
      enabled: true
      artifacts_to_kpis:
        enabled: true
        output: kpis/kpis.json
      kpis_to_csv:
        enabled: true
        output: kpis/kpis.csv
        include_header_comments: true
      artifacts_to_ai_data:
        enabled: false
        output_dir: ai_data

    analyze:
      enabled: true
      historical_kpis: historical_data
      output: regression_analyze/kpi_analyze.json

    s3:
      bucket: mcp-gateway-cpt-data
      instance: nightly
      directory: mcp-gateway-cpt-data
      vault:
        name: psap-forge-aws-s3-export
        aws_credentials_file: aws.credentials
      import:
        enabled: true
        output_dir: historical_data
        include_kpis_json: true
        include_kpis_csv: true
        include_ai_data: false
        max_downloads: 50
      export:
        enabled: true
        upload_id: null
        dry_run: false
        include_csv: true
        include_kpis_json: true
        include_ai_data: false

  export:
    from: null
    verbose: true
    dry_run: false
    backend:
      mlflow:
        enabled: true
        secrets:
          vault:
            name: psap-forge-mlflow-export
            mlflow_secret: mlflow-secret.yaml
        config:
          run_name:
          experiment: mcp-gateway-cpt
          workspace: mcp-gw-cpt
          description: >
            MCP Gateway performance test results
          source_script: mcp_gateway project
          tags: {}
          parameters: {}
          metrics: {}
          run_naming:
            prefix: "forge-mcp-gateway"
            single_run: "{prefix}-s{num_servers}-u{users}-v{mcp_gateway_version}-{timestamp}"
            parent_run: "{prefix}-{preset}-{mcp_gateway_version}-{timestamp}"
            child_run: "{prefix}-s{num_servers}-u{users}-v{mcp_gateway_version}-{timestamp}"
